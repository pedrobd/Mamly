name: App Android (Mamly)

on:
  push:
    paths:
      - 'android/**'
      - 'web/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

# em fila: nunca cancelar uma execução a meio da publicação (deixava o lançamento em rascunho)
concurrency:
  group: mamly-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Desencriptar a chave de assinatura
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Falta o segredo KEYSTORE_PASSWORD (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in android/app/release.keystore.enc -out android/app/release.keystore \
            -pass env:KEYSTORE_PASSWORD

      - name: Instalar o Android 16 (API 36) no SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Compilar o APK e o AAB (formato da Play Store)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle -p android assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Preparar ficheiro
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Mamly.apk
          rm -f android/app/release.keystore
          echo "APK_SHA256=$(sha256sum Mamly.apk | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: Mamly-apk
          path: Mamly.apk

      # O .aab é o ficheiro que se carrega na Play Console (Actions → esta execução → Artifacts)
      - uses: actions/upload-artifact@v4
        with:
          name: Mamly-aab-play-store
          path: android/app/build/outputs/bundle/release/app-release.aab

      # Link fixo para descarregar no telemóvel:
      # https://github.com/<dono>/<repo>/releases/download/mamly/Mamly.apk
      - name: Publicar para download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Antes de substituir o ficheiro, guarda quantos downloads já teve (o contador do GitHub recomeça a zero)
          old=$(gh release view mamly --json body,assets 2>/dev/null || echo '{}')
          cur=$(echo "$old" | jq '[.assets[]?.downloadCount] | add // 0')
          carried=$(echo "$old" | jq -r '.body // ""' | grep -oP 'Downloads de versões anteriores: \K[0-9]+' || true)
          if [ -z "$carried" ] && [ -f .github/downloads-base.txt ]; then carried=$(tr -dc '0-9' < .github/downloads-base.txt); fi
          PREV_DOWNLOADS=$(( cur + ${carried:-0} ))
          echo "Downloads acumulados até agora: $PREV_DOWNLOADS"
          gh release delete mamly --yes --cleanup-tag || true
          gh release create mamly Mamly.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Mamly (app Android)" \
            --notes "Lembretes falados que tocam mesmo com o ecrã desligado. Descarrega Mamly.apk no telemóvel e instala.

          Versão do commit ${GITHUB_SHA::7}.

          Para confirmar que o ficheiro é o verdadeiro:
          - SHA-256 do APK: ${APK_SHA256}
          - Certificado de assinatura (SHA-256): 95:BC:23:51:60:D6:DA:36:85:D5:D7:15:31:9C:FC:53:EF:D1:96:0E:F0:DD:E0:5D:C6:58:17:D3:79:4F:C0:B1

          Downloads de versões anteriores: ${PREV_DOWNLOADS}"
          # garante que fica publicado (não rascunho) e que o link responde
          gh release edit mamly --draft=false --prerelease
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -L "https://github.com/${GITHUB_REPOSITORY}/releases/download/mamly/Mamly.apk")
            echo "link do APK: $code"; [ "$code" = 200 ] && break; sleep 10
          done
