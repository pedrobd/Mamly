name: Site (versão web + links partilhados)

# Publica o site em https://mamly.app/ (domínio configurado em Settings → Pages → Custom domain):
#   /              landing page (site/)
#   /app/          versão web da app (web/)
#   /add.html      página dos lembretes partilhados
#   /privacidade.html, /downloads.html
# Requer: Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ['web/**', 'site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Montar o site
        run: |
          mkdir -p _site/app
          cp -r site/. _site/
          cp -r web/. _site/app/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
